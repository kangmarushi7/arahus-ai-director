# Alembic configuration for AI Director (SQLAlchemy 2.0 / PostgreSQL / Neon).
#
# The database URL is NOT set here. env.py reads DATABASE_URL from the
# environment (and optional .env / .ENV files) so credentials stay out of VCS.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
version_locations = %(here)s/alembic/versions

# Leave empty — populated at runtime from DATABASE_URL in env.py.
sqlalchemy.url =

# Truncate long autogenerate diffs in the terminal; full files are still written.
output_encoding = utf-8

[post_write_hooks]
# Uncomment to auto-format new revisions with ruff when available:
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = check --fix-only REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
